name: Build Windows app

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Get ffmpeg (for tests only; the app ships it separately)
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          New-Item -ItemType Directory -Force ffmpeg | Out-Null
          Get-ChildItem ffmpeg_tmp -Recurse -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination ffmpeg
          echo "$PWD\ffmpeg" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Run tests
        run: python -m pytest tests -q

      - name: Build single exe
        shell: pwsh
        run: |
          $v = python -c "import bridge; print(bridge.__version__)"
          echo "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
          # python3.dll: Resolve's scripting library (fusionscript.dll) loads through it
          $py3 = python -c "import sys, os; print(os.path.join(sys.base_prefix, 'python3.dll'))"
          pyinstaller --noconfirm --onefile --windowed --name "MIUGLITCH AAF Translator" --collect-all customtkinter --collect-all tkinterdnd2 --add-binary "$py3;." --add-data "bridge/assets;bridge/assets" app.py
          Get-Item "dist/MIUGLITCH AAF Translator.exe" | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: MIUGLITCH-AAF-Translator-windows
          path: dist/MIUGLITCH AAF Translator.exe

      - name: Publish release v${{ env.VERSION }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA --title $tag --notes "Build $env:GITHUB_RUN_NUMBER" --prerelease
          }
          gh release upload $tag "dist/MIUGLITCH AAF Translator.exe" --clobber
