name: Build Windows app

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Get ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          New-Item -ItemType Directory -Force ffmpeg | Out-Null
          Get-ChildItem ffmpeg_tmp -Recurse -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination ffmpeg
          echo "$PWD\ffmpeg" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Run tests
        run: python -m pytest tests -q

      - name: Build exe
        run: pyinstaller --noconfirm --windowed --name "MIUGLITCH AAF Translator" --add-binary "ffmpeg/ffmpeg.exe;ffmpeg" --add-binary "ffmpeg/ffprobe.exe;ffmpeg" app.py

      - uses: actions/upload-artifact@v4
        with:
          name: MIUGLITCH-AAF-Translator-windows
          path: dist/MIUGLITCH AAF Translator
